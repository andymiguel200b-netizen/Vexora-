name: Build Vexora APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Vexora project
        run: |
          unzip -o Vexora-github-ready.zip -d vexora
          chmod +x vexora/gradlew

      - name: Build APK
        working-directory: vexora
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexora-debug-APK
          path: vexora/app/build/outputs/apk/debug/*.apk
